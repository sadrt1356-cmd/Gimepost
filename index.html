<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ركن الألعاب – ألعاب خفيفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f3b;--paper:#fff8e7;--sun:#ffd23f;--coral:#ff6b6b;--teal:#3bceac;--card:#ffffff}
@media (prefers-color-scheme:dark){:root{--ink:#fff8e7;--paper:#161933;--card:#232850}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:16px;line-height:1.5}
main{max-width:480px;margin:0 auto}
h1{font-size:2.2rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.5px}
.sub{margin:0 0 16px;opacity:.75}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;font:inherit;font-weight:800;padding:10px 4px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--sun);color:#1b1f3b;box-shadow:3px 3px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
section{display:none;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--ink)}
section.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;gap:8px}
.btn{font:inherit;font-weight:800;padding:6px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--teal);color:#1b1f3b;cursor:pointer}
.msg{min-height:1.6em;text-align:center;font-weight:800}
/* tic tac toe */
#ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
#ttt button{aspect-ratio:1;font:inherit;font-size:2.8rem;font-weight:800;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);cursor:pointer}
#ttt button.x{color:var(--coral)}#ttt button.o{color:var(--teal)}
#ttt button.win{background:var(--sun);color:#1b1f3b}
/* memory */
#mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
#mem button{aspect-ratio:1;font-size:2rem;border:3px solid var(--ink);border-radius:14px;background:var(--coral);color:transparent;cursor:pointer;transition:transform .2s}
#mem button.up{background:var(--paper);color:inherit;transform:rotateY(0)}
#mem button.done{background:var(--teal);color:inherit}
/* snake */
#cv{display:block;width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;background:var(--paper);touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px;direction:ltr}
.pad button{height:48px;font-size:1.4rem;border:3px solid var(--ink);border-radius:12px;background:var(--sun);color:#1b1f3b;cursor:pointer}
.pad .u{grid-column:2}
footer{text-align:center;opacity:.6;font-size:.85rem;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>ركن الألعاب</h1>
  <p class="sub">ثلاث ألعاب خفيفة، بلا تحميل وبلا تسجيل.</p>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-t="g1">إكس أو</button>
    <button role="tab" aria-selected="false" data-t="g2">الذاكرة</button>
    <button role="tab" aria-selected="false" data-t="g3">الثعبان</button>
  </nav>

  <!-- XO -->
  <section id="g1" class="on">
    <div class="bar"><span>أنت ✕ ضد الحاسوب ◯</span><button class="btn" id="tReset">لعبة جديدة</button></div>
    <div id="ttt"></div>
    <p class="msg" id="tMsg"></p>
  </section>

  <!-- Memory -->
  <section id="g2">
    <div class="bar"><span>الحركات: <b id="mMoves">0</b></span><button class="btn" id="mReset">لعبة جديدة</button></div>
    <div id="mem"></div>
    <p class="msg" id="mMsg"></p>
  </section>

  <!-- Snake -->
  <section id="g3">
    <div class="bar"><span>النقاط: <b id="sScore">0</b> · الأفضل: <b id="sBest">0</b></span><button class="btn" id="sReset">ابدأ</button></div>
    <canvas id="cv" width="320" height="320"></canvas>
    <div class="pad">
      <button class="u" data-d="U" aria-label="أعلى">▲</button>
      <button data-d="L" aria-label="يسار" style="grid-row:2">◀</button>
      <button data-d="D" aria-label="أسفل" style="grid-row:2">▼</button>
      <button data-d="R" aria-label="يمين" style="grid-row:2">▶</button>
    </div>
    <p class="msg" id="sMsg">الأسهم أو السحب بالإصبع</p>
  </section>

  <footer>ملف واحد: index.html</footer>
</main>

<script>
// ---- Tabs ----
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  if(b.dataset.t!=='g3')stopSnake();
});

// ---- Tic Tac Toe ----
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let tb,tOver;
const tEl=document.getElementById('ttt'),tMsg=document.getElementById('tMsg');
function winner(b){for(const l of L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return l;return null}
function mm(b,p){const w=winner(b);if(w)return b[w[0]]==='O'?1:-1;if(b.every(Boolean))return 0;
  let best=p==='O'?-2:2;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==='O'?'X':'O');b[i]=null;best=p==='O'?Math.max(best,s):Math.min(best,s)}
  return best}
function aiMove(){let bi=-1,bs=-2;
  for(let i=0;i<9;i++)if(!tb[i]){tb[i]='O';const s=mm(tb,'X');tb[i]=null;if(s>bs){bs=s;bi=i}}
  tb[bi]='O'}
function tDraw(){const w=winner(tb);
  tEl.innerHTML='';
  tb.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v==='X'?'✕':v==='O'?'◯':'';
    b.className=(v?v.toLowerCase():'')+(w&&w.includes(i)?' win':'');
    b.setAttribute('aria-label','خانة '+(i+1));b.onclick=()=>tPlay(i);tEl.appendChild(b)});
}
function tEnd(){const w=winner(tb);
  if(w){tOver=true;tMsg.textContent=tb[w[0]]==='X'?'ربحتي! 🎉':'الحاسوب ربح 😅'}
  else if(tb.every(Boolean)){tOver=true;tMsg.textContent='تعادل 🤝'}}
function tPlay(i){if(tOver||tb[i])return;tb[i]='X';tEnd();if(!tOver){aiMove();tEnd()}tDraw()}
function tReset(){tb=Array(9).fill(null);tOver=false;tMsg.textContent='';tDraw()}
document.getElementById('tReset').onclick=tReset;tReset();

// ---- Memory ----
const mEl=document.getElementById('mem'),mMsg=document.getElementById('mMsg'),mMoves=document.getElementById('mMoves');
let first=null,lock=false,moves=0,pairs=0;
function mReset(){
  const e=['🐱','🐶','🦊','🐸','🐼','🦁','🐵','🐙'];
  const d=[...e,...e].sort(()=>Math.random()-.5);
  mEl.innerHTML='';first=null;lock=false;moves=0;pairs=0;mMoves.textContent=0;mMsg.textContent='';
  d.forEach(v=>{const b=document.createElement('button');b.dataset.v=v;b.textContent=v;b.setAttribute('aria-label','بطاقة');
    b.onclick=()=>flip(b);mEl.appendChild(b)})}
function flip(b){
  if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');
  if(!first){first=b;return}
  moves++;mMoves.textContent=moves;
  if(first.dataset.v===b.dataset.v){
    first.className=b.className='done';first=null;pairs++;
    if(pairs===8)mMsg.textContent='برافو! كملتيها في '+moves+' حركة 🎉';
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');lock=false},700)}
}
document.getElementById('mReset').onclick=mReset;mReset();

// ---- Snake ----
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),N=16,C=cv.width/N;
const sS=document.getElementById('sScore'),sB=document.getElementById('sBest'),sM=document.getElementById('sMsg');
let sn,dir,nd,food,score,timer=null,best=0;
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
sB.textContent=best;
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n)}
function place(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(p=>p[0]===food[0]&&p[1]===food[1]))}
function sReset(){stopSnake();sn=[[8,8],[7,8],[6,8]];dir=nd='R';score=0;sS.textContent=0;sM.textContent='';place();sDraw();timer=setInterval(tick,130)}
function stopSnake(){clearInterval(timer);timer=null}
function turn(d){const o={U:'D',D:'U',L:'R',R:'L'};if(o[d]!==dir)nd=d}
function tick(){
  dir=nd;const h=[sn[0][0]+V[dir][0],sn[0][1]+V[dir][1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]===h[0]&&p[1]===h[1])){
    stopSnake();sM.textContent='خسرتي 😅 جرب مرة أخرى';
    if(score>best){best=score;sB.textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}
    return}
  sn.unshift(h);
  if(h[0]===food[0]&&h[1]===food[1]){score++;sS.textContent=score;place()}else sn.pop();
  sDraw()}
function sDraw(){
  ctx.fillStyle=css('--paper').trim()||'#fff8e7';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(food[0]*C+C/2,food[1]*C+C/2,C/2-3,0,7);ctx.fill();
  sn.forEach((p,i)=>{ctx.fillStyle=i?'#3bceac':'#1fa588';ctx.fillRect(p[0]*C+1,p[1]*C+1,C-2,C-2)})}
document.getElementById('sReset').onclick=sReset;
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>turn(b.dataset.d));
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};
  if(m[e.key]&&document.getElementById('g3').classList.contains('on')){e.preventDefault();turn(m[e.key])}});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
sn=[[8,8],[7,8],[6,8]];food=[12,8];sDraw();
</script>
</body>
</html>
